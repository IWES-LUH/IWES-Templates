name: Release Templates

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build template zip files
        run: |
          zip -r thesis-english.zip thesis-english/
          zip -r thesis-german.zip  thesis-german/
          zip -r beamer.zip         beamer/
          zip -r poster.zip         poster/

      - name: Force-update 'latest' tag
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git tag -f latest
          git push -f origin latest

      - name: Create or update 'latest' GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Templates"
          body: |
            Auto-updated release — always reflects the current state of the `main` branch.

            ## Download

            | File | Template |
            |---|---|
            | `thesis-english.zip` | English thesis |
            | `thesis-german.zip`  | German thesis  |
            | `beamer.zip`         | Beamer presentation slides |
            | `poster.zip`         | A0 scientific poster |

            ## Overleaf
            Download a zip → Overleaf **New Project → Upload Project**.

            > **Fonts:** Rotis Sans Serif Std is not included (commercial license).
            > See `FONTS.md` in the `font/` or `Rotis/` folder of each template.
          files: |
            thesis-english.zip
            thesis-german.zip
            beamer.zip
            poster.zip
          make_latest: true
